<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>애니메이션콘텐츠제작 7주차 · 애니 배경 만들기</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#141821;--sub:#5b6474;--line:#e3e7ef;--accent:#1d4ed8}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#171b23;--ink:#eef1f6;--sub:#9aa3b2;--line:#2a303b;--accent:#7aa2ff}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Pretendard,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:40px 36px;max-width:560px;width:100%}
.no{font-size:13px;font-weight:800;letter-spacing:1.4px;color:var(--accent)}
h1{font-size:30px;letter-spacing:-.8px;margin:10px 0 12px}
p{color:var(--sub);line-height:1.6;font-size:15.5px}
a{display:inline-block;margin-top:26px;color:var(--accent);font-weight:700;text-decoration:none}
</style></head>
<body><div class="box">
<div class="no">WEEK 07 · 공개수업</div>
<h1>애니 배경 만들기</h1>
<p>공개수업으로 진행한 차시입니다.<br>수업 자료는 준비되는 대로 이 자리에 올라옵니다.</p>

</div></body></html>
